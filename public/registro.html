<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Atlantic City | Registro
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
 </head>
 <body class="auth-page">
  <main class="auth-wrapper">
   <section class="auth-card">
    <div class="brand-mark">
     ATLANTIC
     <span>
      CITY
     </span>
    </div>
    <p class="auth-subtitle">
     Creaci&oacute;n de cuenta
    </p>
    <h1>
     Reg&iacute;strate
    </h1>
    <form id="registerForm">
     <div class="mb-3">
      <label class="form-label" for="registerName">
       Nombres y apellidos
      </label>
      <input class="form-control" id="registerName" required=""/>
     </div>
     <div class="mb-3">
      <label class="form-label" for="registerEmail">
       Correo electr&oacute;nico
      </label>
      <input class="form-control" id="registerEmail" required="" type="email"/>
     </div>
     <div class="mb-3">
      <label class="form-label" for="registerPhone">
       Tel&eacute;fono
      </label>
      <input class="form-control" id="registerPhone" required=""/>
     </div>
     <div class="mb-3">
      <label class="form-label" for="registerPassword">
       Contrase&ntilde;a
      </label>
      <div class="password-field">
       <input class="form-control" id="registerPassword" minlength="10" required="" type="password" autocomplete="new-password"/>
       <button class="password-toggle" type="button" data-toggle-password="registerPassword" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
      </div>
     </div>
     <button class="btn btn-gold w-100" type="submit">
      Crear cuenta
     </button>
    </form>
    <div class="auth-links">
     <span>
      &iquest;Ya tienes una cuenta?
      <a href="index.html">
       Inicia sesi&oacute;n
      </a>
     </span>
    </div>
   </section>
  </main>
  <script src="js/common.js">
  </script>
  <script src="js/auth.js">
  </script>
 <div class="text-center small p-2">Demostración académica de servicios culturales y recreativos ficticios. Sin apuestas, pagos reales ni datos personales reales.</div>
</body>
</html>
